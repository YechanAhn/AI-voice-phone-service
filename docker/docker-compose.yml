services:
  # === Infrastructure ===
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reservations
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # === LiveKit (Media Server + SIP Bridge) ===
  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"   # HTTP/WS
      - "7881:7881"   # TCP (ICE)
      - "7882:7882/udp"  # UDP (ICE)
    environment:
      LIVEKIT_KEYS: "devkey: secret"
    command: --dev

  livekit-sip:
    image: livekit/sip:latest
    depends_on:
      - livekit
    ports:
      - "5060:5060/udp"   # SIP signaling
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      SIP_PORT: 5060

  # === Application ===
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/reservations
      REDIS_URL: redis://redis:6379/0
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret

volumes:
  postgres_data:
